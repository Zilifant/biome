<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>biome — ASCII renderer</title>
  <link rel="stylesheet" href="/renderer/app/styles/dracula.css" />
  <link rel="stylesheet" href="/renderer/app/styles/renderer.css" />
</head>
<body>
  <div id="app">
    <header id="status-bar"></header>
    <div id="main">
      <div id="viewport-wrap">
        <canvas
          id="biome-canvas"
          tabindex="0"
          role="img"
          aria-label="ASCII grid view of the biome simulation. Animals and plants are drawn as colored monospace characters; use the inspector panel for a text description of the selected entity."
        ></canvas>
      </div>
      <aside id="sidebar">
        <section id="controls-panel" aria-label="Simulation and camera controls"></section>
        <!-- Dock target for the inspector. Hidden until the floating popover is
             docked into it; the popover is the default surface. -->
        <section id="inspector-panel" aria-label="Cell inspector" hidden></section>
        <section id="metrics-panel" aria-label="Population metrics"></section>
        <section id="event-log-panel" aria-label="Domain event log"></section>
      </aside>
    </div>
    <footer id="help-bar">
      drag or arrows/WASD to pan (shift = fast) &middot; +/- or wheel zoom &middot; click any cell to inspect it
      &middot; Tab cycle occupants &middot; F follow &middot; C recenter &middot; Esc clear &middot; Space pause/resume
      &middot; ?mode=fixture for offline replay
    </footer>
  </div>
  <script type="module" src="/renderer/app/main.js"></script>
</body>
</html>
