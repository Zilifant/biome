<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>biome — ASCII renderer</title>
    <link rel="stylesheet" href="/renderer/app/styles/dracula.css" />
    <link rel="stylesheet" href="/renderer/app/styles/renderer.css" />
  </head>
  <body>
    <div id="app">
      <header id="status-bar"></header>
      <!-- Five columns: events, the docked inspector, the grid, population, and
         the sidebar. The inspector's track collapses to nothing while it floats. Each aside
         carries a drag handle on its *inner* edge (the one facing the grid),
         placed in the same grid track as the column it resizes so it overlays
         the column edge rather than taking a track of its own. -->
      <div id="main">
        <aside id="events-column" class="panel-column">
          <section id="event-log-panel" aria-label="Domain event log"></section>
        </aside>
        <div
          class="col-resizer"
          data-resize="events-column"
          role="separator"
          aria-orientation="vertical"
          tabindex="0"
          title="Drag to resize · arrow keys to nudge · double-click to reset"
        ></div>
        <!-- The docked inspector's own column, mirroring the population column
           on the other side of the grid. It is the default home for the
           inspector; floating it collapses this track to nothing (see
           `#main[data-inspector]` in renderer.css) rather than leaving an empty
           gutter beside the map. -->
        <aside id="inspector-column" class="panel-column">
          <section id="inspector-panel" aria-label="Cell inspector"></section>
        </aside>
        <div
          class="col-resizer"
          data-resize="inspector-column"
          role="separator"
          aria-orientation="vertical"
          tabindex="0"
          title="Drag to resize · arrow keys to nudge · double-click to reset"
        ></div>
        <div id="viewport-wrap">
          <canvas
            id="biome-canvas"
            tabindex="0"
            role="img"
            aria-label="ASCII grid view of the biome simulation. Animals and plants are drawn as colored monospace characters; use the inspector panel for a text description of the selected entity."
          ></canvas>
        </div>
        <aside id="population-column" class="panel-column">
          <section id="metrics-panel" aria-label="Population metrics"></section>
        </aside>
        <div
          class="col-resizer"
          data-resize="population-column"
          role="separator"
          aria-orientation="vertical"
          tabindex="0"
          title="Drag to resize · arrow keys to nudge · double-click to reset"
        ></div>
        <aside id="sidebar" class="panel-column">
          <section
            id="controls-panel"
            aria-label="Simulation and camera controls"
          ></section>
          <section id="layers-panel" aria-label="Map layers"></section>
          <section id="legend-panel" aria-label="Glyph legend"></section>
        </aside>
        <div
          class="col-resizer"
          data-resize="sidebar"
          role="separator"
          aria-orientation="vertical"
          tabindex="0"
          title="Drag to resize · arrow keys to nudge · double-click to reset"
        ></div>
      </div>
      <footer id="help-bar">
        drag or arrows/WASD to pan (shift = fast) &middot; +/- or wheel zoom
        &middot; click any cell to inspect it &middot; Tab cycle occupants
        &middot; F follow &middot; C recenter &middot; Esc clear &middot; Space
        pause/resume &middot; drag a column edge to resize it &middot;
        ?mode=fixture for offline replay &middot; ?renderer=sprite for sprites
        &middot; <a href="/sprite-editor.html">sprite editor</a>
      </footer>
    </div>
    <script type="module" src="/renderer/app/main.js"></script>
  </body>
</html>
